name: Backend checks
# Backend + planner + constraints + simulation + mock_backend, with a real PostgreSQL 16.
on:
  push:
    branches: [develop, main, backend]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uzel12_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci_disposable_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d uzel12_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Disposable CI database only; never a real credential.
      TEST_DATABASE_URL: postgresql://test_user:ci_disposable_password@localhost:5432/uzel12_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Contracts are up to date
        run: |
          python scripts/generate_contracts.py
          git diff --exit-code -- shared
      - name: All Python tests (backend, planner, constraints, simulation, mock_backend, PostgreSQL)
        run: python -m pytest -q
      - name: Every PostgreSQL test actually ran
        run: python -m pytest -q -m postgres -rs | tee postgres.txt && ! grep -q SKIPPED postgres.txt
      - name: Simulation suite through unittest (documented command)
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests/simulation -v
      - name: Application module imports cleanly
        env:
          PYTHONPATH: backend
        run: python -c "from app.main import app; print(app.title)"
