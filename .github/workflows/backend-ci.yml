name: Backend checks
on:
  push:
    branches: [backend]
  pull_request:
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'tests/**'
      - 'scripts/generate_contracts.py'
      - '.github/workflows/backend-ci.yml'
      - 'pyproject.toml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uzel12_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci_disposable_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d uzel12_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test_user:ci_disposable_password@localhost:5432/uzel12_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python scripts/generate_contracts.py
      - run: git diff --exit-code -- shared
      - run: python -m pytest -q
