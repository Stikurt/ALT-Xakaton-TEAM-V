name: planner-simulation-integration

on:
  push:
    branches:
      - integration/planner-simulation
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Simulation tests
        run: python -m unittest discover -s tests/simulation -v

      - name: Planner tests
        working-directory: backend
        run: python -m pytest tests -v

      - name: Planner + simulation integration tests
        env:
          PYTHONPATH: backend
        run: python -m pytest tests/integration/test_planner_simulation.py -v
