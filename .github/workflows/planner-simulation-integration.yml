name: planner-simulation-integration
# Planner + constraints + simulation end to end on the real 15-train station.
on:
  push:
    branches: [develop, main, integration/planner-simulation]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Simulation tests
        run: python -m unittest discover -s tests/simulation -v
      - name: Planner and constraints tests
        run: python -m pytest backend/tests -v
      - name: Planner + simulation integration tests
        run: python -m pytest tests/integration -v
      - name: Offline 15-train scenario
        run: python tests/simulation/run_scenarios.py
